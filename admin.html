<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ניהול - פניני חיזוק</title>
<style>
    body { font-family: sans-serif; background: #0d0d0d; color: #f2ebd9; margin: 0; padding: 2rem 1rem; }
    :root { --gold: #c5a059; }
    .box { max-width: 700px; margin: 0 auto; background: #1a1a1a; border: 2px solid var(--gold); border-radius: 8px; padding: 2rem; }
    h1 { color: var(--gold); font-size: 1.6rem; margin-top: 0; }
    h2 { color: var(--gold); font-size: 1.2rem; border-top: 1px solid #333; padding-top: 1.5rem; margin-top: 2rem; }
    input, textarea, button { font-family: inherit; font-size: 1rem; }
    input[type=password], textarea { width: 100%; box-sizing: border-box; padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; }
    textarea { min-height: 160px; resize: vertical; }
    button { background: var(--gold); color: #000; border: none; padding: 10px 20px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:hover { background: #fff; }
    .stat-row { display: flex; gap: 20px; margin-top: 1rem; flex-wrap: wrap; }
    .stat-card { background: #111; border: 1px solid #444; border-radius: 8px; padding: 15px 20px; text-align: center; min-width: 140px; }
    .stat-card .num { font-size: 2rem; color: var(--gold); font-weight: bold; }
    .stat-card .lbl { font-size: 0.9rem; color: #aaa; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 0.95rem; }
    td, th { padding: 6px 10px; border-bottom: 1px solid #333; text-align: right; }
    .msg { margin-top: 10px; font-size: 0.95rem; }
    .msg.ok { color: #25D366; }
    .msg.err { color: #f44336; }
    #locked, #unlocked { display: none; }
    .price-grid { display: grid; grid-template-columns: 1fr 100px; gap: 10px 15px; align-items: center; margin-top: 10px; }
    .price-grid label { color: #ccc; font-size: 0.95rem; }
    .price-grid input { width: 100%; box-sizing: border-box; }
    .pickup-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
    .pickup-row input.city { width: 140px; flex-shrink: 0; }
    .pickup-row input.address { flex: 1; }
    .pickup-row .remove-row { background: #442222; color: #f44336; border: none; padding: 8px 10px; border-radius: 4px; cursor: pointer; flex-shrink: 0; }
    .promo-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; background: #111; border: 1px solid var(--gold); border-radius: 4px; padding: 8px 12px; }
    .promo-row .promo-text { flex: 1; color: #fff; font-size: 0.95rem; }
    .promo-row .remove-row { background: #442222; color: #f44336; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    #promo-product-select { padding: 8px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; }
</style>
</head>
<body>

<div id="locked" class="box">
    <h1>כניסת ניהול</h1>
    <input type="password" id="secret-input" placeholder="סיסמת ניהול">
    <button onclick="unlock()">כניסה</button>
    <div class="msg err" id="lock-msg"></div>
</div>

<div id="unlocked" class="box">
    <h1>ניהול האתר - פניני חיזוק</h1>

    <h2>מבקרים באתר</h2>
    <div class="stat-row">
        <div class="stat-card"><div class="num" id="online-count">-</div><div class="lbl">מחוברים כרגע</div></div>
        <div class="stat-card"><div class="num" id="today-count">-</div><div class="lbl">נכנסו היום</div></div>
    </div>
    <table id="days-table">
        <thead><tr><th>תאריך</th><th>כניסות</th></tr></thead>
        <tbody></tbody>
    </table>
    <button onclick="loadStats()">רענן נתונים</button>

    <h2>נקודות איסוף</h2>
    <p style="color:#aaa; font-size:0.9rem;">לכל נקודת איסוף: עיר (תודגש אוטומטית) וכתובת.</p>
    <div id="pickup-rows"></div>
    <button onclick="addPickupRow()" style="background:#333; color:var(--gold); margin-top:10px;">+ הוסף נקודה</button>
    <br>
    <button onclick="savePickup()">שמור נקודות איסוף</button>
    <div class="msg" id="pickup-msg"></div>

    <h2>ניהול מחירים</h2>
    <div class="price-grid" id="price-grid"></div>

    <h2>מבצעים</h2>
    <p style="color:#aaa; font-size:0.9rem;">מבצע "כמות = מחיר" על מוצר - למשל 2 יחידות שערי תשובה ב-40 ₪.</p>
    <div id="promo-rows"></div>
    <div style="display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap;">
        <select id="promo-product-select"></select>
        <input type="number" id="promo-qty" placeholder="כמות" style="width:80px;">
        <input type="number" id="promo-price" placeholder="מחיר מבצע ₪" style="width:120px;">
        <button onclick="addPromoRow()" style="background:#333; color:var(--gold);">+ הוסף מבצע</button>
    </div>
    <button onclick="savePrices()" style="margin-top:1rem;">שמור מחירים</button>
    <div class="msg" id="price-msg"></div>
</div>

<script>
    const WEBHOOK_URL = 'https://old-glitter-dac3.meny85502.workers.dev/';
    let SECRET = '';
    let refreshTimer = null;
    let currentBundles = {}; // { productId: { bundleQty, bundlePrice } } - נערך חי בדף, נשמר עם "שמור מחירים"

    // הרשימה הקבועה שכרגע מוטמעת ב-index.html - משמשת ברירת מחדל אם עוד לא נשמר דבר בשרת
    const DEFAULT_PICKUP_POINTS = [
        { city: 'בני ברק', address: 'ישיבת פוניבז\' (בניין אהל קדושים, רחוב ראב"ד)' },
        { city: 'בני ברק', address: 'רחוב ירושלים 36' },
        { city: 'גבעת זאב', address: 'רחוב המכבים' },
        { city: 'ירושלים', address: 'שכונת רמות, מירסקי 5' }
    ];

    const DEFAULT_PRICES = {
        mesilat: 25, shaarei: 25, orchot: 25, chovot: 50, fullset: 120,
        shemirat: 25, mesilat_soft: 10, shaarei_soft: 10, softset: 20, shemirat_soft_set: 20
    };
    const PRICE_LABELS = {
        mesilat: 'מסילת ישרים', shaarei: 'שערי תשובה', orchot: 'ארחות צדיקים', chovot: 'חובות הלבבות',
        fullset: 'סט ספרי מוסר (מלא)', shemirat: 'שמירת הלשון',
        mesilat_soft: 'מסילת ישרים - כריכה רכה', shaarei_soft: 'שערי תשובה - כריכה רכה',
        softset: 'סט (כריכה רכה)', shemirat_soft_set: 'כריכה רכה - שמירת הלשון (בקרוב)'
    };

    function unlock() {
        SECRET = document.getElementById('secret-input').value;
        document.getElementById('lock-msg').innerText = 'בודק...';
        loadStats(true);
    }

    async function loadStats(isUnlockAttempt) {
        try {
            const res = await fetch(WEBHOOK_URL + 'stats?secret=' + encodeURIComponent(SECRET));
            if (!res.ok) {
                if (isUnlockAttempt) {
                    let detail = '';
                    try { const errData = await res.json(); detail = errData.details ? ' (' + errData.details + ')' : ''; } catch (e) {}
                    document.getElementById('lock-msg').innerText =
                        (res.status === 403 ? 'סיסמה שגויה.' : 'שגיאת שרת' + detail + '.');
                }
                return;
            }
            const data = await res.json();

            if (isUnlockAttempt) {
                document.getElementById('locked').style.display = 'none';
                document.getElementById('unlocked').style.display = 'block';

                // ממלאים את שורות נקודות ההפצה רק בכניסה - לא בכל רענון אוטומטי, כדי לא לדרוס עריכה באמצע
                const points = (data.pickupPoints && Array.isArray(data.pickupPoints) && data.pickupPoints.length > 0)
                    ? data.pickupPoints
                    : DEFAULT_PICKUP_POINTS;
                renderPickupRows(points);

                // ממלאים את טבלת המחירים - גם כאן רק בכניסה, לא בכל רענון
                const prices = Object.assign({}, DEFAULT_PRICES, data.prices || {});
                const grid = document.getElementById('price-grid');
                grid.innerHTML = Object.keys(PRICE_LABELS).map(id =>
                    `<label>${PRICE_LABELS[id]}</label><input type="number" id="price-${id}" value="${prices[id]}">`
                ).join('');

                // מבצעים - כל מה שכבר קיים בשרת (או ריק אם אין)
                currentBundles = Object.assign({}, data.bundles || {});
                renderPromoProductSelect();
                renderPromoRows();

                // רענון אוטומטי של הסטטיסטיקות (לא של תיבות העריכה) כל 10 שניות
                if (refreshTimer) clearInterval(refreshTimer);
                refreshTimer = setInterval(() => loadStats(false), 20000);
            }

            document.getElementById('online-count').innerText = (data.online === null) ? 'לא זמין היום' : (data.online ?? '-');
            const today = new Date().toISOString().slice(0,10);
            document.getElementById('today-count').innerText = (data.days && data.days[today]) ?? 0;

            const tbody = document.querySelector('#days-table tbody');
            tbody.innerHTML = '';
            if (data.days) {
                Object.keys(data.days).sort().reverse().forEach(day => {
                    tbody.innerHTML += `<tr><td>${day}</td><td>${data.days[day]}</td></tr>`;
                });
            }
        } catch (e) {
            if (isUnlockAttempt) document.getElementById('lock-msg').innerText = 'שגיאת תקשורת עם השרת.';
        }
    }

    function renderPickupRows(points) {
        const container = document.getElementById('pickup-rows');
        container.innerHTML = '';
        points.forEach(p => addPickupRow(p.city || '', p.address || ''));
    }

    function addPickupRow(city, address) {
        const container = document.getElementById('pickup-rows');
        const row = document.createElement('div');
        row.className = 'pickup-row';
        row.innerHTML = `
            <input type="text" class="city" placeholder="עיר" value="${city ? city.replace(/"/g,'&quot;') : ''}">
            <input type="text" class="address" placeholder="כתובת" value="${address ? address.replace(/"/g,'&quot;') : ''}">
            <button class="remove-row" onclick="this.parentElement.remove()">✖</button>
        `;
        container.appendChild(row);
    }

    async function savePickup() {
        const points = [...document.querySelectorAll('.pickup-row')].map(row => ({
            city: row.querySelector('.city').value.trim(),
            address: row.querySelector('.address').value.trim()
        })).filter(p => p.city || p.address);

        const msgEl = document.getElementById('pickup-msg');
        msgEl.className = 'msg'; msgEl.innerText = 'שומר...';
        try {
            const res = await fetch(WEBHOOK_URL + 'save-pickup?secret=' + encodeURIComponent(SECRET), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ points })
            });
            if (res.ok) {
                msgEl.className = 'msg ok'; msgEl.innerText = 'נשמר בהצלחה! השינוי יופיע באתר תוך רגע.';
            } else {
                let detail = '';
                try { const errData = await res.json(); detail = errData.details ? ' (' + errData.details + ')' : ''; } catch (e) {}
                msgEl.className = 'msg err';
                msgEl.innerText = (res.status === 403 ? 'סיסמה שגויה.' : 'שמירה נכשלה' + detail + '.');
            }
        } catch (e) {
            msgEl.className = 'msg err'; msgEl.innerText = 'שגיאת תקשורת.';
        }
    }

    function renderPromoProductSelect() {
        const sel = document.getElementById('promo-product-select');
        sel.innerHTML = Object.keys(PRICE_LABELS).map(id =>
            `<option value="${id}">${PRICE_LABELS[id]}</option>`
        ).join('');
    }

    function renderPromoRows() {
        const container = document.getElementById('promo-rows');
        const ids = Object.keys(currentBundles);
        if (ids.length === 0) {
            container.innerHTML = '<div class="empty-cart-msg" style="color:#888; padding:8px 0;">אין מבצעים פעילים כרגע.</div>';
            return;
        }
        container.innerHTML = ids.map(id => {
            const b = currentBundles[id];
            const label = PRICE_LABELS[id] || id;
            return `<div class="promo-row">
                <span class="promo-text">${label}: ${b.bundleQty} = ב-${b.bundlePrice} ₪</span>
                <button class="remove-row" onclick="removePromoRow('${id}')">✖ הסר</button>
            </div>`;
        }).join('');
    }

    function addPromoRow() {
        const id = document.getElementById('promo-product-select').value;
        const qty = parseInt(document.getElementById('promo-qty').value);
        const price = parseInt(document.getElementById('promo-price').value);
        if (!id || !qty || !price) {
            alert('יש למלא כמות ומחיר מבצע תקינים');
            return;
        }
        currentBundles[id] = { bundleQty: qty, bundlePrice: price };
        document.getElementById('promo-qty').value = '';
        document.getElementById('promo-price').value = '';
        renderPromoRows();
    }

    function removePromoRow(id) {
        delete currentBundles[id];
        renderPromoRows();
    }

    async function savePrices() {
        const prices = {};
        Object.keys(PRICE_LABELS).forEach(id => {
            prices[id] = parseInt(document.getElementById('price-' + id).value) || 0;
        });
        const msgEl = document.getElementById('price-msg');
        msgEl.className = 'msg'; msgEl.innerText = 'שומר...';
        try {
            const res = await fetch(WEBHOOK_URL + 'save-prices?secret=' + encodeURIComponent(SECRET), {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prices, bundles: currentBundles })
            });
            if (res.ok) {
                msgEl.className = 'msg ok'; msgEl.innerText = 'המחירים והמבצעים נשמרו! ייראו באתר תוך רגע.';
            } else {
                let detail = '';
                try { const errData = await res.json(); detail = errData.details ? ' (' + errData.details + ')' : ''; } catch (e) {}
                msgEl.className = 'msg err';
                msgEl.innerText = (res.status === 403 ? 'סיסמה שגויה.' : 'שמירה נכשלה' + detail + '.');
            }
        } catch (e) {
            msgEl.className = 'msg err'; msgEl.innerText = 'שגיאת תקשורת.';
        }
    }

    document.getElementById('locked').style.display = 'block';
</script>
</body>
</html>
